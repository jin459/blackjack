[workspace]
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Async
tokio       = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow    = "1"

# Identifiers & time
uuid   = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Tracing / logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web  = "0.7"

# OpenTelemetry
opentelemetry                    = "0.22"
opentelemetry_sdk                = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp               = { version = "0.15", features = ["tonic"] }
opentelemetry-semantic-conventions = "0.14"
opentelemetry-prometheus         = "0.15"
tracing-opentelemetry            = "0.23"
prometheus                       = "0.13"

# Redis (cache + streams message queue)
redis = { version = "0.25", features = ["tokio-comp", "streams", "connection-manager"] }

# Web
actix-web    = "4"
actix-ws     = "0.3"
futures-util = "0.3"

# Config
config   = "0.14"
dotenvy  = "0.15"
